name: release

# Run by hand from the Actions tab (or the API) after the PR is merged. It builds the Lean proof and
# runs the axiom audit again, then publishes a GitHub release with the paper files in dist/ and the
# notes in .github/RELEASE_NOTES.md. Zenodo archives the release and mints a DOI if the repository
# is switched on at https://zenodo.org/account/settings/github/.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0"
        required: true
        default: "v2.1.0"
      target:
        description: "Branch or commit to tag"
        required: true
        default: "main"
      title:
        description: "Release title"
        required: true
        default: "R(B_57, B_58) = 231, journal version"

permissions:
  contents: write

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target }}
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build and audit
        working-directory: lean
        run: |
          set -o pipefail
          lake build
          lake env lean Check.lean 2>&1 | tee ../lean-check.txt
          python3 ../scripts/audit_axioms.py ../lean-check.txt

  release:
    needs: lean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target }}
      - name: Check the paper files
        run: |
          for f in dist/book-ramsey-58_final2.pdf dist/book-ramsey-58_final2-tex.zip \
                   dist/book-ramsey-58_final2-arxiv.tar.gz dist/book-ramsey-67_final2.pdf \
                   dist/book-ramsey-67_final2-tex.zip dist/book-ramsey-67_final2-arxiv.tar.gz \
                   paper/paper1/book-ramsey-58.pdf paper/paper2/book-ramsey-58-tex.zip; do
            test -s "$f" || { echo "missing $f"; exit 1; }
          done
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TARGET: ${{ inputs.target }}
          TITLE: ${{ inputs.title }}
        run: |
          gh release create "$TAG" dist/book-ramsey-58_final2* dist/book-ramsey-67_final2* \
            paper/paper1/book-ramsey-58.pdf paper/paper2/book-ramsey-58-tex.zip \
            --target "$TARGET" \
            --title "$TAG: $TITLE" \
            --notes-file .github/RELEASE_NOTES.md
